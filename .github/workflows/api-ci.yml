name: API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsevote-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: pulsevote-backend
        run: npm ci

      - name: Lint backend
        working-directory: pulsevote-backend
        run: npm run lint

      - name: Run unit tests with coverage
        working-directory: pulsevote-backend
        run: npm run test:coverage

      - name: Analyse backend with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: pulsevote-backend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Clear CI database
        working-directory: pulsevote-backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ALLOW_DB_CLEAR: "true"
        run: npm run db:clear

      - name: Build backend Docker image
        run: docker build -t pulsevote-api ./pulsevote-backend

      - name: Start backend container
        run: |
          docker run -d \
            --name pulsevote-api \
            -p 5000:5000 \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            pulsevote-api

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "API health check failed"
          docker logs pulsevote-api
          exit 1

      - name: Install Newman
        run: npm install -g newman

           - name: Run Postman RBAC tests
        working-directory: pulsevote-backend
        env:
          POSTMAN_TEST_PASSWORD: ${{ secrets.POSTMAN_TEST_PASSWORD }}
        run: |
          newman run "postman/PulseVote RBAC Test.postman_collection.json" \
            --env-var "PROTOCOL=http" \
            --env-var "HOST=localhost" \
            --env-var "PORT=5000" \
            --env-var "ADMIN_PASSWORD=$POSTMAN_TEST_PASSWORD" \
            --env-var "MANAGER_PASSWORD=$POSTMAN_TEST_PASSWORD" \
            --env-var "USER_PASSWORD=$POSTMAN_TEST_PASSWORD"